name: Packer Status Check

on:
  pull_request:
    branches: [main]

jobs:
  packer-format-validate:
    name: packer-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Run packer fmt
        run: |
          cd packer
          packer fmt -check -diff .

      - name: Run packer init
        run: |
          cd packer
          packer init .

      - name: Run packer validate
        env:
          PKR_VAR_aws_region: ${{ secrets.AWS_REGION }}
          PKR_VAR_aws_instance_type: ${{ secrets.AWS_INSTANCE_TYPE }}
          PKR_VAR_source_ami: ${{ secrets.SOURCE_AMI }}
          PKR_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
          PKR_VAR_ssh_username: ${{ secrets.SSH_USERNAME }}
          PKR_VAR_password: ${{ secrets.DB_PASSWORD }}
          PKR_VAR_database_name: ${{ secrets.DB_NAME }}
          PKR_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
          PKR_VAR_gcp_region: ${{ secrets.GCP_REGION }}
          PKR_VAR_source_gcp: ${{ secrets.SOURCE_GCP }}
        run: |
          cd packer
          packer validate .
