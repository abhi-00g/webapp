name: Packer Status Check

on:
  pull_request:
    branches: [main]

jobs:
  packer-format-validate:
    name: packer-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Ensure packer directory exists
        run: mkdir -p packer

      - name: Generate variables.pkrvars.hcl
        run: |
          set -e  # Exit immediately if any command fails

          # Ensure secrets are not empty (fail early if missing)
          : "${{ secrets.AWS_REGION?Missing AWS_REGION secret }}"
          : "${{ secrets.AWS_INSTANCE_TYPE?Missing AWS_INSTANCE_TYPE secret }}"
          : "${{ secrets.SOURCE_AMI?Missing SOURCE_AMI secret }}"
          : "${{ secrets.SUBNET_ID?Missing SUBNET_ID secret }}"
          : "${{ secrets.SSH_USERNAME?Missing SSH_USERNAME secret }}"
          : "${{ secrets.DB_PASSWORD?Missing DB_PASSWORD secret }}"
          : "${{ secrets.DB_NAME?Missing DB_NAME secret }}"
          : "${{ secrets.GCP_PROJECT_ID?Missing GCP_PROJECT_ID secret }}"
          : "${{ secrets.GCP_REGION?Missing GCP_REGION secret }}"
          : "${{ secrets.MACHINE_TYPE?Missing MACHINE_TYPE secret }}"
          : "${{ secrets.SOURCE_GCP?Missing SOURCE_GCP secret }}"

          # Write the variables.pkrvars.hcl file properly (Fixing Indentation)
          cat <<EOF > packer/variables.pkrvars.hcl
aws_region        = "${{ secrets.AWS_REGION }}"
aws_instance_type = "${{ secrets.AWS_INSTANCE_TYPE }}"
source_ami       = "${{ secrets.SOURCE_AMI }}"
subnet_id        = "${{ secrets.SUBNET_ID }}"
ssh_username     = "${{ secrets.SSH_USERNAME }}"
password         = "${{ secrets.DB_PASSWORD }}"
database_name    = "${{ secrets.DB_NAME }}"
gcp_project_id   = "${{ secrets.GCP_PROJECT_ID }}"
gcp_region       = "${{ secrets.GCP_REGION }}"
machine_type     = "${{ secrets.MACHINE_TYPE }}"
source_gcp       = "${{ secrets.SOURCE_GCP }}"
EOF

      - name: Run packer fmt
        run: |
          cd packer
          packer fmt -check -diff .

      - name: Run packer validate
        run: |
          cd packer
          packer validate -var-file=variables.pkrvars.hcl