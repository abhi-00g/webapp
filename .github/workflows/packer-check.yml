name: Packer Status Check

on:
  pull_request:
    branches: [main]

jobs:
  packer-format-validate:
    name: packer-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Ensure Packer Directory Exists
        run: |
          mkdir -p webapp/packer

      - name: Create Packer Variables File
        run: |
          cat <<EOF > webapp/packer/variables.pkrvars.hcl
          aws_region        = "${{ secrets.AWS_REGION }}"
          aws_instance_type = "${{ secrets.AWS_INSTANCE_TYPE }}"
          source_ami        = "${{ secrets.SOURCE_AMI }}"
          subnet_id         = "${{ secrets.SUBNET_ID }}"
          gcp_project_id    = "${{ secrets.GCP_PROJECT_ID }}"
          gcp_region        = "${{ secrets.GCP_REGION }}"
          source_gcp        = "${{ secrets.SOURCE_GCP }}"
          ssh_username      = "${{ secrets.SSH_USERNAME }}"
          password          = "${{ secrets.PASSWORD }}"
          database_name     = "${{ secrets.DATABASE_NAME }}"
          EOF

      - name: Run packer fmt
        run: |
          cd webapp/packer
          packer fmt -check -diff .

      - name: Run packer validate
        run: |
          cd webapp/packer
          packer validate -var-file=variables.pkrvars.hcl